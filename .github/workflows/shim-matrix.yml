name: shim-matrix

# Verifies the claude-dx-done launcher shim (bin/dx-done) resolves the correct
# per-platform binary by `uname -s` and execs it, on real clean public runners.
#
# The shim is invoked the way Claude Code invokes it: the plugin's bin/ dir is
# prepended to PATH and `dx-done` is called by name (PLUGIN_CONVENTIONS §3), so
# the test exercises PATH resolution -> shebang -> uname dispatch -> exec of the
# per-platform stub. The Linux + macOS jobs are the bash-path mechanics gate.
# The Windows job runs two paths and is the whole point of this repo (see below).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Compile the linux stub the shim resolves to
        run: go build -o bin/dx-done-linux-x64 ./stub
      - name: Shim resolves + execs via the bash path
        run: |
          set -euo pipefail
          echo "uname -s => $(uname -s)"
          export PATH="$PWD/bin:$PATH"
          chmod +x bin/dx-done
          out="$(dx-done)"
          echo "shim output: $out"
          echo "$out" | grep -q 'dx-done v'

  macos:
    runs-on: macos-latest    # Apple Silicon (arm64) -> exercises the Darwin -> dx-done-macos-arm64 branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Compile the macOS (arm64) stub the shim resolves to
        run: go build -o bin/dx-done-macos-arm64 ./stub
      - name: Strip quarantine xattr (Gatekeeper) so exec is not a false-fail
        run: xattr -cr bin/dx-done-macos-arm64 || true
      - name: Shim resolves + execs via the bash path
        run: |
          set -euo pipefail
          echo "uname -s => $(uname -s)"
          export PATH="$PWD/bin:$PATH"
          chmod +x bin/dx-done
          out="$(dx-done)"
          echo "shim output: $out"
          echo "$out" | grep -q 'dx-done v'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Compile the Windows stub the shim resolves to
        run: go build -o bin/dx-done-windows-x64.exe ./stub

      # --- Path A: Git Bash. This is the path Claude Code's Bash tool takes on
      #     Windows (it runs commands through Git Bash). EXPECTED PASS, and this
      #     step GATES the job — it is the "is the bash shim enough on Windows"
      #     answer for the common path.
      - name: "Path A - Git Bash spawn (gates the job)"
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -s => $(uname -s)"
          export PATH="$PWD/bin:$PATH"
          chmod +x bin/dx-done
          out="$(dx-done)"
          echo "shim output: $out"
          echo "$out" | grep -q 'dx-done v'
          {
            echo "### Windows Path A - Git Bash spawn: PASS"
            echo "uname -s => $(uname -s)"
            echo "shim output => \`$out\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Path B: native non-bash spawn. PowerShell calls the extension-less
      #     shim file directly, the way a `cmd`/`pwsh` user (no bash in the loop)
      #     would. EXPECTED FAIL: Windows' process spawner cannot run a
      #     `#!/usr/bin/env bash` file natively. This is CHARACTERIZED, NOT
      #     GATED — continue-on-error keeps the job green; a failure here is the
      #     informative answer, not a test failure.
      - name: "Path B - native non-bash spawn (characterized, not gated)"
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          # The canonical non-bash spawn: cmd.exe (no bash in the loop) is asked
          # to run the extension-less shim file by name, the way a cmd/pwsh-only
          # tester would. Expected to FAIL -- Windows' process spawner cannot run
          # a `#!/usr/bin/env bash` file natively (no shebang handling, and the
          # file has no executable extension in PATHEXT).
          $out = ''
          try {
            $out = (cmd /c "bin\dx-done" 2>&1 | Out-String)
          } catch {
            $out = $_.Exception.Message
          }
          $code = $LASTEXITCODE
          Write-Host "native (cmd /c) exit code: $code"
          Write-Host $out
          # Plain lines only -- no markdown fences/backticks (backtick is pwsh's
          # escape char and broke the summary write in the first run).
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows Path B - native non-bash spawn: FAIL (expected, informative)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "A non-bash caller (cmd/pwsh) cannot run the #!/usr/bin/env bash shim by name."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "native (cmd /c) exit code: $code"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $out.Trim()
